name: Generate 30-minute WortFlip listening sessions

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  make_listening:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out WortFlip
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original English voice tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install piper-tts==1.8.0
      - name: Download original English Piper voice only
        run: python -m piper.download_voices en_US-lessac-medium
      - name: Build continuous MP3s from existing German recordings at 0.5x
        run: python scripts/generate_30min_listening.py
      - name: Confirm every MP3 is at least 30 minutes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          sessions=json.loads(Path('listening/30min-sessions.json').read_text())['sessions']
          assert sessions, 'No long recordings generated'
          for s in sessions:
              file=Path(s['file'])
              secs=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(file)],text=True))
              assert secs >= 1799.5, (file, secs)
              print(f'{file}: {secs/60:.1f} minutes')
          PY
      - name: Save rebuilt long-session MP3s and manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listening/audio30/*.mp3 listening/30min-sessions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild bilingual sessions with half-speed Victoria and Thorsten'
            git push
          fi
      - name: Request GitHub Pages refresh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            -X POST -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
