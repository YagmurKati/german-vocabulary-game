name: Prepare WortFlip four-speed listening

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export device speech cards and update flashcard speed selector
        run: python scripts/prepare_listening.py
      - name: Publish changes (no TTS, no paid services)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js listening/30min-device-cards.json
          if ! git diff --cached --quiet; then
            git commit -m 'Enable four-speed German playback and publish device listening text'
            git push
          fi
      - name: Request Pages update
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            -X POST -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
