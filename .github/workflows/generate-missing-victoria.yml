name: Generate free German Victoria clips

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview eight samples first or generate all 1,000 missing clips
        required: true
        type: choice
        default: preview
        options:
          - preview
          - all

permissions:
  contents: write
  pages: write

jobs:
  free_victoria:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out WortFlip
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio conversion tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Start free local KokoroTTS with the German Victoria model
        run: |
          # Use the public GitHub Container Registry release by tag.
          # No Azure, paid API, secret or login is required.
          docker run -d --name wortflip-victoria \
            -e KOKOROTTS_DEVICE=cpu \
            -p 127.0.0.1:7860:7860 \
            ghcr.io/hangry-labs/kokorotts:v1.0_tiny
          python - <<'PY'
          import time,urllib.request
          for i in range(120):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:7860/health/ready',timeout=5) as r:
                      if r.status == 200:
                          print('KokoroTTS ready');break
              except Exception:pass
              time.sleep(5)
          else: raise SystemExit('KokoroTTS could not start within 10 minutes')
          PY
      - name: Generate the free Victoria German clips
        run: python scripts/generate_missing_victoria.py --mode "${{ inputs.mode }}"
      - name: Downloadable pronunciation samples - preview only
        if: inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: wortflip-victoria-preview
          path: victoria-preview/*.mp3
          retention-days: 7
      - name: Update WortFlip player to use both voices at half speed - all only
        if: inputs.mode == 'all'
        run: python scripts/patch_victoria_playback.py
      - name: Commit only the 1,000 new recordings, manifest and player updates
        if: inputs.mode == 'all'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/*.mp3 audio/tracks.json index.html listening/30-minute.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Add free Victoria German voice clips and half-speed German playback'
            git push
          fi
      - name: Request GitHub Pages refresh
        if: inputs.mode == 'all'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            -X POST -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: Print server diagnostics if workflow fails
        if: failure()
        run: docker logs --tail=80 wortflip-victoria || true
