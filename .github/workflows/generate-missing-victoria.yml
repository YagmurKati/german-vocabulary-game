name: Generate free German Victoria clips

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview eight samples at 100% speed, or generate all 1,000 clips
        required: true
        type: choice
        default: preview
        options:
          - preview
          - all

permissions:
  contents: write
  pages: write

jobs:
  free_victoria:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio conversion tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Start free Victoria KokoroTTS server
        run: |
          docker run -d --name wortflip-victoria \
            -e KOKOROTTS_DEVICE=cpu \
            -p 127.0.0.1:7860:7860 \
            ghcr.io/hangry-labs/kokorotts:v1.0_tiny
          python - <<'PY'
          import time,urllib.request
          for i in range(120):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:7860/health/ready',timeout=5) as r:
                      if r.status==200:
                          print('Victoria server ready.');break
              except Exception:pass
              time.sleep(5)
          else: raise SystemExit('Victoria server not ready within 10 minutes')
          PY
      - name: Generate the eight samples or all 1,000 at 100% natural speed
        run: python scripts/generate_missing_victoria.py --mode "${{ inputs.mode }}"
      - name: Save preview samples for listening (not published)
        if: inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: wortflip-victoria-normal-speed-preview
          path: victoria-preview/*.mp3
          retention-days: 7
      - name: Update flashcards for all 1,300 recorded voices
        if: inputs.mode == 'all'
        run: python scripts/prepare_listening.py
      - name: Publish new Victoria MP3s without replacing existing Thorsten clips
        if: inputs.mode == 'all'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/*.mp3 audio/tracks.json index.html sw.js listening/30min-device-cards.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add normal-speed Victoria German recordings and four-speed controls'
            git push
          fi
      - name: Ask Pages to refresh
        if: inputs.mode == 'all'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            -X POST -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: Diagnostics if server or generation fails
        if: failure()
        run: docker logs --tail=80 wortflip-victoria || true
