name: Generate consistent German pronunciation recordings
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview 10 pronunciation samples first, or generate all 1200 files'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - all

permissions:
  contents: write
  pages: write

jobs:
  create_audio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install text-to-speech tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install piper-tts==1.8.0
      - name: Download German voice once
        run: python -m piper.download_voices de_DE-thorsten-medium
      - name: Create 10 preview clips for pronunciation review
        if: inputs.mode == 'preview'
        run: python scripts/generate_german_audio.py --model de_DE-thorsten-medium.onnx --preview
      - name: Downloadable preview (not published on your website)
        if: inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: wortspiel-german-pronunciation-preview
          path: audio/*.mp3
          retention-days: 7
      - name: Create all 1200 German audio clips
        if: inputs.mode == 'all'
        run: python scripts/generate_german_audio.py --model de_DE-thorsten-medium.onnx
      - name: Check generated count and file types
        if: inputs.mode == 'all'
        run: |
          test "$(find audio -maxdepth 1 -name '*.mp3' | wc -l)" -eq 1200
          file audio/l000.mp3 audio/e000.mp3 audio/x000.mp3
      - name: Publish audio files to the same repository
        if: inputs.mode == 'all'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/*.mp3
          if ! git diff --cached --quiet; then
            git commit -m 'Add consistent German pronunciation recordings (Piper)'
            git push
          fi
      - name: Ask GitHub Pages to rebuild from main
        if: inputs.mode == 'all'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub does not automatically build a branch-Pages site from a GITHUB_TOKEN push.
          # Request a new build explicitly; if denied, use a manual README commit instead.
          curl --fail-with-body --silent --show-error --location \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
